version: 2

models:
  - name: EMPLOYEE
    description: "Employee model."

    columns:
      - name: EMP_ID
        description: "Unique employee ID."
        tests:
          - unique
          - not_null

      - name: EMP_NAME
        description: "Employee name."

      - name: DEPARTMENT
        description: "Employee department."

      - name: SALARY
        description: "Employee salary."

      - name: HIRE_DATE
        description: "Employee hire date."